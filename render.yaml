services:
  - type: web
    name: university-student-chatbot-backend
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: university-student-chatbot-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: ./Frontend